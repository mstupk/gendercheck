# ============================================================================
# OpenNMT-py v3  —  German Gender Annotation  (A40 / 40 GB VRAM)
#
# Differences from train_config.yaml (RTX 4090 / 24 GB):
#   batch_size       4096  →  8192
#   valid_batch_size 2048  →  4096
#   accum_count         4  →  2     (effective global batch stays 16 384 tokens)
#   save_model / log_file point to model_a40/
#
# ALL PATHS are relative to ~/  (home directory).
# The project must be placed at ~/gendercheck/ on the target machine.
# ============================================================================


# ── Data ──────────────────────────────────────────────────────────────────────
data:
    corpus_1:
        path_src: opennmt_run/train.src
        path_tgt: opennmt_run/train.tgt
        weight: 1

    valid:
        path_src: opennmt_run/valid.src
        path_tgt: opennmt_run/valid.tgt


# ── Vocabulary ────────────────────────────────────────────────────────────────
src_vocab: opennmt_run/vocab.src
tgt_vocab: opennmt_run/vocab.tgt
share_vocab: false

src_vocab_size: 50000
tgt_vocab_size: 50000
vocab_size_multiple: 8


# ── Paths ─────────────────────────────────────────────────────────────────────
save_data: opennmt_run/prepared/gendercheck
overwrite: true

save_model: opennmt_run/model_a40/gendercheck
save_checkpoint_steps: 5000
keep_checkpoint: 5

log_file: opennmt_run/model_a40/train.log


# ── Sequence lengths ──────────────────────────────────────────────────────────
skip_empty_level: silent
src_seq_length: 200
tgt_seq_length: 220


# ── Model architecture: Transformer base ──────────────────────────────────────
encoder_type: transformer
decoder_type: transformer

enc_layers: 6
dec_layers: 6
heads: 8
hidden_size: 512
word_vec_size: 512
transformer_ff: 2048

dropout_steps: [0]
dropout: [0.1]
attention_dropout: [0.1]

max_relative_positions: 20


# ── Training ──────────────────────────────────────────────────────────────────
model_dtype: fp16

batch_type: tokens
batch_size: 8192
batch_size_multiple: 8
valid_batch_size: 4096

accum_count: [2]
accum_steps: [0]

normalization: tokens

train_steps: 70000
valid_steps: 1000
early_stopping: 10
early_stopping_criteria: ppl

average_decay: 0.0001
average_every: 1


# ── Optimisation ──────────────────────────────────────────────────────────────
optim: adam
adam_beta1: 0.9
adam_beta2: 0.998

decay_method: noam
warmup_steps: 8000
learning_rate: 2

max_grad_norm: 0
label_smoothing: 0.1
param_init: 0.0
param_init_glorot: true


# ── GPU ───────────────────────────────────────────────────────────────────────
world_size: 1
gpu_ranks: [0]


# ── Data loading ──────────────────────────────────────────────────────────────
num_workers: 0
bucket_size: 32768


# ── Reporting ─────────────────────────────────────────────────────────────────
report_every: 100
